[project]
name = "enterprise-kb"
version = "0.1.0"
description = "企业知识库 · 混合检索 + 权限感知 + 引用溯源 检索服务"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "litellm>=1.55",
    "qdrant-client>=1.12",
    "elasticsearch>=8.15,<9",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "tiktoken>=0.8",
    "tenacity>=9.0",
    "orjson>=3.10",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
# 本地 embedding / rerank 兜底（生产建议用 TEI 服务，避免模型重复加载）
local-models = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "FlagEmbedding>=1.3",
]
# MinerU 解析（GPU 环境；CPU 亦可但慢）
mineru = [
    "mineru[core]>=2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ragas>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
